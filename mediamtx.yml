# MediaMTX configuration for RAAHI Edge
# Listens on RTSP port 8555 for Android RootEncoder publishing

logLevel: info
logDestinations: [stdout]

# RTSP Server
rtsp: yes
rtspAddress: :8555
rtspTransports: [udp, multicast, tcp]
rtspEncryption: "no"
rtpAddress: :8000
rtcpAddress: :8001

# Disable protocols not needed for Edge capture to keep overhead minimal
rtmp: no
hls: no
webrtc: no
srt: no
moq: no

# Stream path configuration
paths:
  live:
    # Allow publisher from Android app
    # Allow readers from OpenCV and FFmpeg
  all_others:
