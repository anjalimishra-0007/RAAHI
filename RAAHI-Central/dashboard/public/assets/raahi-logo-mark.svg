<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-label="RAAHI Brand Mark">
  <defs>
    <!-- Left Blade Primary Gradient -->
    <linearGradient id="raahiLeftGrad" x1="18%" y1="82%" x2="56%" y2="20%">
      <stop offset="0%" stop-color="#b052ff" />
      <stop offset="35%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Left Blade Specular Glass Refraction -->
    <linearGradient id="raahiLeftSheen" x1="25%" y1="75%" x2="52%" y2="25%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Right Blade Primary Gradient -->
    <linearGradient id="raahiRightGrad" x1="55%" y1="85%" x2="70%" y2="18%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="30%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#00f5c4" />
      <stop offset="100%" stop-color="#3ee2a2" />
    </linearGradient>

    <!-- Right Blade Specular Glass Refraction -->
    <linearGradient id="raahiRightSheen" x1="56%" y1="75%" x2="68%" y2="20%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Left Blade Luminous Rim Edge -->
    <linearGradient id="raahiLeftRim" x1="15%" y1="80%" x2="55%" y2="20%">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.95" />
    </linearGradient>

    <!-- Right Blade Luminous Rim Edge -->
    <linearGradient id="raahiRightRim" x1="55%" y1="85%" x2="72%" y2="18%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.95" />
    </linearGradient>

    <!-- Floor Ambiance Glows -->
    <radialGradient id="raahiFloorLeft" cx="28%" cy="85%" r="28%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#9333ea" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="raahiFloorRight" cx="72%" cy="85%" r="28%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#0891b2" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ground Floor Reflections -->
  <ellipse cx="28" cy="85" rx="14" ry="3.5" fill="url(#raahiFloorLeft)" />
  <ellipse cx="72" cy="85" rx="16" ry="3.5" fill="url(#raahiFloorRight)" />

